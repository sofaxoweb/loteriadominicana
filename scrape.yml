# Actualiza los resultados automáticamente cada 30 minutos en horario de sorteos.
# Flujo: scrape → verificación cruzada → actualiza data.js → regenera → commit+push.
# Si hay conflictos o errores, abre un issue de alerta (no se publica nada dudoso).
name: Actualizar resultados

on:
  schedule:
    # 10:00–19:30 hora dominicana (AST = UTC-4)
    - cron: "*/30 14-23 * * *"
    # 20:00–23:30 hora dominicana
    - cron: "*/30 0-3 * * *"
  workflow_dispatch: # ejecución manual desde la pestaña Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar scraper
        id: scrape
        continue-on-error: true
        run: node tools/scraper/run.js

      - name: Commit y push si hay cambios
        if: always()
        run: |
          git config user.name "LotoGana Bot"
          git config user.email "lotogana-bot@users.noreply.github.com"
          git add assets/data.js index.html loteria/ tools/scraper/report.json
          if git diff --cached --quiet; then
            echo "Sin cambios en resultados."
          else
            git commit -m "Auto: resultados $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi

      - name: Alerta si hubo conflictos o errores
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('tools/scraper/report.json', 'utf8'));
            const body = [
              'El scraper encontró conflictos o errores. Esos sorteos **NO** se publicaron.',
              '',
              '```json',
              JSON.stringify({ conflicts: report.conflicts, errors: report.errors, unmapped: report.unmapped }, null, 2),
              '```',
              '',
              'Revisa manualmente las fuentes y actualiza `assets/data.js` si hace falta.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Revisar sorteos ${report.at.slice(0, 10)}`,
              body,
              labels: ['scraper'],
            });
